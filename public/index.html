<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Battle Area</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <div id="info">Connecting...</div>
    <div id="score">Score: 0</div>
  </div>
  <div id="home">
    <div class="home-box">
      <h1>Battle Area</h1>
      <p>モードを選択してください</p>
      <p>
        <input id="playerName" placeholder="プレイヤー名（例: 太郎）" style="padding:8px;width:80%;border-radius:6px;border:0;margin-top:8px" />
      </p>
      <div class="buttons">
        <button id="btnCpu">CPU戦（ボットと対戦）</button>
        <button id="btnOnline">オンライン対戦</button>
      </div>
      <p class="hint">※ どちらもサーバーに接続します。人間プレイヤーが少ない場合はサーバーがボットを補充します。</p>
    </div>
  </div>
  <canvas id="game"></canvas>
  <script src="client.js"></script>
</body>
</html>
